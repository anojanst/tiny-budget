name: Android APK

# Tagging is the release gesture: `git tag mobile-v1.0.0 && git push --tags`
# builds the APK and attaches it to a GitHub Release. The manual trigger is
# there for dry runs that produce an artifact without publishing anything.
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the app id is exposed job-wide, so the distribution step's `if` can
    # read it — a step's own `env` is not available to its own condition. The
    # service-account key deliberately stays on that one step: anything at job
    # level is readable by every step, `npm ci` and its dependency tree
    # included.
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No setup-android action: the runner image already ships the SDK, and
      # that action still asks sdkmanager for the long-obsolete `tools`
      # package, which Google removed from the repository — so it fails before
      # doing anything useful. Gradle downloads any missing platform itself;
      # the licences are pre-accepted on the image.
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK on the runner (ANDROID_HOME unset)."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK: $SDK"
          echo "build-tools present:"
          ls "$SDK/build-tools"

      - name: Install workspace
        run: npm ci

      # The shared money engine is the thing worth breaking a release over.
      - name: Test and typecheck
        run: |
          npm test
          npm --workspace @tiny-budget/mobile run typecheck

      # The android/ project is generated rather than committed, so it always
      # matches app.json instead of drifting from it.
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Gradle's caches survive between runs, which is most of the difference
      # between a cold 25-minute build and a warm one.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          # One architecture, not four. arm64-v8a covers every Android phone
          # of the last decade; the x86 pair exists for emulators and
          # armeabi-v7a for hardware that predates this app's minimum. Building
          # all four quadrupled a compile that is mostly React Native's C++.
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a

      # Signed after the build rather than through Gradle: prebuild regenerates
      # build.gradle every run, so anything patched into it would be thrown
      # away. apksigner replaces whatever signature the template applied.
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See apps/mobile/DISTRIBUTING.md."
            exit 1
          fi
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Signing $APK"

          # Whitespace-tolerant: a secret this long is usually pasted, and a
          # paste picks up wrapping and stray spaces that base64 -d rejects
          # outright with "invalid input".
          KS="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — it was probably truncated in transit. Set it straight from the file instead of pasting: base64 -w0 apps/mobile/tiny-budget.keystore | gh secret set ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          # A keystore is PKCS12 (30 82 ...) or JKS (FE ED FE ED); anything
          # else decoded cleanly but is not a keystore, and apksigner's error
          # for that is far less obvious than this one.
          MAGIC=$(xxd -p -l 2 "$KS")
          if [ "$MAGIC" != "3082" ] && [ "$(xxd -p -l 4 "$KS")" != "feedfeed" ]; then
            echo "::error::The decoded secret is not a keystore (starts $MAGIC). Re-set ANDROID_KEYSTORE_BASE64 from the keystore file."
            exit 1
          fi
          # Magic bytes prove it is *a* keystore but not an intact one — a
          # truncated file still starts 30 82, and truncation is exactly what a
          # long pasted secret suffers. Opening it is the only real check, and
          # it validates the password and alias in the same move, so all three
          # ways this can be wrong are caught here rather than inside
          # apksigner where the message is far less clear.
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" \
                 -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Could not open the keystore. Either ANDROID_KEYSTORE_BASE64 is incomplete (paste it straight from the file: base64 -w0 apps/mobile/tiny-budget.keystore | gh secret set ANDROID_KEYSTORE_BASE64), or ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS do not match it."
            rm -f "$KS"
            exit 1
          fi
          echo "Keystore verified: $(stat -c%s "$KS") bytes, alias present"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out tiny-budget.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs tiny-budget.apk
          rm -f "$KS"

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-budget-apk
          path: tiny-budget.apk
          if-no-files-found: error

      # The distribution list. A GitHub Release is a link anyone can find;
      # this emails an install link to each address in testers.txt, and emails
      # them again on every later release — which is the part a link cannot
      # do. Skipped entirely when FIREBASE_APP_ID is unset, so the release
      # still builds and publishes for anyone who has not set Firebase up.
      - name: Send to the distribution list
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.FIREBASE_APP_ID != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_APP_ID is set but FIREBASE_SERVICE_ACCOUNT is not. See apps/mobile/DISTRIBUTING.md."
            exit 1
          fi

          KEY="$RUNNER_TEMP/firebase-key.json"
          # Created empty and private first: the key must never exist, even for
          # an instant, at a mode another process on the runner could read.
          install -m 600 /dev/null "$KEY"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY"
          # The same lesson as the keystore: a long secret that travelled
          # through a clipboard arrives truncated, and the CLI's error for that
          # is about authentication rather than about the key being cut in half.
          if ! jq -e '.type == "service_account" and has("client_email") and has("private_key")' "$KEY" >/dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not a complete service-account JSON key — it was probably truncated in transit. Set it straight from the file: gh secret set FIREBASE_SERVICE_ACCOUNT < path/to/key.json"
            exit 1
          fi

          # Comments and blank lines are for the humans who edit the list; the
          # CLI wants addresses only.
          LIST="$RUNNER_TEMP/testers.txt"
          sed -e 's/#.*//' -e 's/[[:space:]]//g' apps/mobile/testers.txt \
            | grep -v '^$' > "$LIST" || true
          COUNT=$(wc -l < "$LIST")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::apps/mobile/testers.txt lists nobody, so this release would reach no one. Add an address or unset FIREBASE_APP_ID."
            exit 1
          fi
          echo "Distributing to $COUNT tester(s)"

          NOTES="$RUNNER_TEMP/notes.txt"
          { echo "$GITHUB_REF_NAME"; echo; git log -1 --pretty=%s; } > "$NOTES"

          GOOGLE_APPLICATION_CREDENTIALS="$KEY" \
            npx --yes firebase-tools@15 appdistribution:distribute tiny-budget.apk \
              --app "$FIREBASE_APP_ID" \
              --testers-file "$LIST" \
              --release-notes-file "$NOTES"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tiny-budget.apk
          generate_release_notes: true
          body: |
            Download `tiny-budget.apk` below and open it on your phone.

            Android will warn that it came from outside the Play Store — that
            warning is about the source, not the file. Allow installs for
            whichever app you downloaded it with, then open it again.

            Everything stays on your device. There is no account and no server.
